name: Build StackChan Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - 'platformio.ini'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18

      - name: Build CoreS3 firmware
        run: pio run -e stackchan-cores3

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-cores3-firmware
          path: |
            .pio/build/stackchan-cores3/firmware.bin
            .pio/build/stackchan-cores3/bootloader.bin
            .pio/build/stackchan-cores3/partitions.bin
          if-no-files-found: error
          retention-days: 14



