name: Build StackChan Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/

      - name: Setup Board Manager
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Libraries
        run: |
          # 安装基础开源库
          arduino-cli lib install "M5Unified"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "WebSockets"
          arduino-cli lib install "ESP8266Audio"
          
          # 拉取 Avatar 和 WiFiManager
          mkdir -p ~/Arduino/libraries
          git clone --depth 1 https://github.com/meganetaaan/m5stack-avatar.git ~/Arduino/libraries/M5Stack-Avatar
          git clone --depth 1 https://github.com/tzapu/WiFiManager.git ~/Arduino/libraries/WiFiManager

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,PartitionScheme=huge_app,PSRAM=opi firmware/firmware.ino --output-dir build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-cores3-firmware
          path: build/*.bin



